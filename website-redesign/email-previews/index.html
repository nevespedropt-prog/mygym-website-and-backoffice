set=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"x-apple-disable-message-reformatting\">\n\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"supported-color-schemes\" content=\"light\">\n\u003ctitle>Your MY GYM London password was changed\u003c/title>\n\u003cstyle>\n@font-face{font-family:'Barlow Condensed';font-weight:800;font-style:normal;src:url(./fonts/barlow-condensed-800.woff2) format('woff2')}\n@font-face{font-family:'Barlow Condensed';font-weight:700;font-style:normal;src:url(./fonts/barlow-condensed-700.woff2) format('woff2')}\nbody{margin:0;padding:0;background:#f6f5f4;-webkit-text-size-adjust:100%}\na{color:#e03939}\n@media only screen and (max-width:620px){.wrap{width:100%!important}h1{font-size:38px!important;line-height:38px!important}.pad{padding-left:22px!important;padding-right:22px!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody style=\"margin:0;padding:0;background:#f6f5f4\">\n\u003cdiv style=\"display:none;max-height:0;overflow:hidden;opacity:0;color:#f6f5f4;font-size:1px;line-height:1px\">If this was not you, tell us straight away.&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;\u003c/div>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background:#f6f5f4\">\u003ctr>\u003ctd align=\"center\" style=\"padding:22px 12px\">\n\u003ctable role=\"presentation\" class=\"wrap\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"width:600px;max-width:600px;background:#ffffff\">\n\u003ctr>\u003ctd style=\"padding:18px 32px;background:#ffffff\">\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd style=\"vertical-align:middle\">\u003cimg src=\"./icons/logo-header.png\" width=\"132\" alt=\"MY GYM London\" style=\"display:block;border:0;height:auto;max-width:132px\">\u003c/td>\n\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\n\u003ctr>\u003ctd style=\"background:#e03939;padding:34px 32px 30px 32px\">\n  \u003ch1 style=\"margin:0;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:800;font-size:46px;line-height:46px;letter-spacing:.02em;text-transform:uppercase;color:#ffffff\">Your password was changed\u003c/h1>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"line-height:0;font-size:0;background-color:#e03939;background-image:linear-gradient(to bottom right,#e03939 49.6%,#ffffff 50%);height:26px\">&nbsp;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:30px 32px 8px 32px;background:#ffffff\">\n\u003cp style=\"margin:0 0 16px 0;font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.65;color:#17171a\">Hi,\u003c/p>\n\u003cp style=\"margin:0 0 16px 0;font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.65;color:#17171a\">This is a confirmation that the password for your MY GYM London account was just changed.\u003c/p>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin:6px 0 20px 0\">\u003ctr>\u003ctd style=\"background:#fdecec;border-left:4px solid #a03535;padding:15px 18px;font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.6;color:#5a1f1f\">Was this not you? Reply to this email straight away and we will secure your account.\u003c/td>\u003c/tr>\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-top:1px solid #e6e4e4;margin-top:6px\">\u003ctr>\u003ctd style=\"padding:16px 0 22px 0;font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;line-height:1.6;color:#62616a\">Questions? Just reply to this email or write to \u003ca href=\"mailto:info@mygymlondon.co.uk\" style=\"color:#e03939\">info@mygymlondon.co.uk\u003c/a>.\u003c/td>\u003c/tr>\u003c/table>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"background:#e03939;line-height:0;font-size:0;height:5px\">&nbsp;\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"background:#17171a;padding:28px 32px\">\n  \u003cp style=\"margin:0 0 6px 0;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:#ffffff\">MY GYM London\u003c/p>\n  \u003cp style=\"margin:0 0 14px 0;font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;line-height:1.6;color:#cfcdd1\">MY GYM London, Main Avenue, Bush Hill Park, Enfield EN1 1DS\u003cbr>\u003ca href=\"mailto:info@mygymlondon.co.uk\" style=\"color:#ffffff;text-decoration:underline\">info@mygymlondon.co.uk\u003c/a>\u003c/p>\n  \u003cp style=\"margin:0 0 16px 0;font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;color:#cfcdd1\">\u003ca href=\"https://www.mygymlondon.co.uk/our-classes\" style=\"color:#ffffff;text-decoration:underline\">Timetable\u003c/a> &nbsp;&middot;&nbsp; \u003ca href=\"https://www.mygymlondon.co.uk/memberships\" style=\"color:#ffffff;text-decoration:underline\">Memberships\u003c/a> &nbsp;&middot;&nbsp; \u003ca href=\"https://www.instagram.com/mygym_london\" style=\"color:#ffffff;text-decoration:underline\">Instagram\u003c/a>\u003c/p>\n  \u003cp style=\"margin:0;font-family:Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:11.5px;line-height:1.6;color:#9a99a1\">This is a service email about your MY GYM London account or booking, so it is sent even if you have unsubscribed from marketing.\u003cbr>MyGym London\u003c/p>\n\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\n\u003c/body>\u003c/html>","text":"YOUR PASSWORD WAS CHANGED\n\nHi,\n\nThis is a confirmation that the password for your MY GYM London account was just changed.\n\nWas this not you? Reply to this email straight away and we will secure your account.\n\nMY GYM London\nMY GYM London, Main Avenue, Bush Hill Park, Enfield EN1 1DS\ninfo@mygymlondon.co.uk"}];const groups=["Account","Bookings","Membership & payments","Keep members engaged","Campaigns","Website forms","To the gym","Sign-in (Supabase Auth)"];let cur=0,mode="d";
const list=document.getElementById("list");
groups.forEach(g=>{const h=document.createElement("h2");h.textContent=g;list.appendChild(h);items.forEach((it,i)=>{if(it.group!==g)return;const b=document.createElement("button");b.dataset.i=i;b.innerHTML=it.id.replace(/-/g," ")+"<small>"+({member:"to the member",lead:"to a visitor",admin:"to the gym",auth:"sign-in email"}[it.to])+(it.marketing?" · marketing":"")+"</small>";b.onclick=()=>{cur=i;show()};list.appendChild(b)})});
function show(){document.querySelectorAll("aside button").forEach(b=>b.classList.toggle("on",+b.dataset.i===cur));const it=items[cur];document.getElementById("sub").textContent="Subject: "+it.subject;const st=document.getElementById("stage");st.innerHTML="";
if(mode==="t"){const p=document.createElement("pre");p.textContent=it.text;st.appendChild(p)}else{const f=document.createElement("iframe");f.srcdoc=it.html;f.className=mode==="m"?"m":"";f.onload=()=>{f.style.height=f.contentDocument.documentElement.scrollHeight+"px"};st.appendChild(f)}
["bd","bm","bt"].forEach(id=>document.getElementById(id).classList.toggle("on",{bd:"d",bm:"m",bt:"t"}[id]===mode))}
document.getElementById("bd").onclick=()=>{mode="d";show()};document.getElementById("bm").onclick=()=>{mode="m";show()};document.getElementById("bt").onclick=()=>{mode="t";show()};show();
</script></body></html>
